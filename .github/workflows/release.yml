# Tag a version, get a release with a zip on it.
#
#     git tag v1.0 && git push origin v1.0
#
# Windows only, because that is what the executable is for; anybody on another
# platform runs it from source, which is three commands and in the README.
name: release

on:
  push:
    tags: ["v*"]
  # So the build can be proven without spending a version number on it. The
  # zip lands as an artifact instead of a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the game and the builder need
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pyinstaller

      # Generated rather than committed, so the release always ships art that
      # matches the code that draws it.
      - name: Draw the starter texture pack
        run: python -m tools.make_starter_pack

      - name: Build
        run: python tools/make_release.py

      - name: Check it starts
        # One tick with a dummy video driver: proves the frozen build can find
        # its font and its packs, which is the half of this that silently
        # breaks. A build that cannot draw is not worth publishing.
        run: python tools/check_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: AsciiCrawler-windows
          path: dist/*.zip

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
