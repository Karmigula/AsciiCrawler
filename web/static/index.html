<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AsciiCrawler</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <section id="stage">
    <div id="boss" hidden>
      <span id="boss-name"></span>
      <span id="boss-bar"><i></i></span>
    </div>
    <canvas id="view" width="900" height="600"></canvas>
    <div id="underbar">
      <p class="corner">
        <span id="viewers"></span>
        <button id="open-hall" type="button">hall of fame <kbd>h</kbd></button>
        <button id="open-legend" type="button">symbols <kbd>j</kbd></button>
        <a href="https://github.com/Karmigula/AsciiCrawler">source</a>
      </p>
      <p id="status">connecting…</p>
    </div>
  </section>
  <aside id="side">
    <h1>AsciiCrawler</h1>
    <p class="blurb">
      Nobody plays this. An <code>@</code> explores an endless dungeon on its
      own, fights what it meets, and forgets what it has not seen lately.
      Everyone here is watching the same one.
    </p>
    <pre id="hud"></pre>
    <pre id="worn"></pre>
    <pre id="log"></pre>

  </aside>
</main>

<div id="legend" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-label="What the symbols mean">
    <h2>what everything is</h2>
    <div class="scroll"><div id="legend-body" class="legend"></div></div>
  </div>
</div>

<div id="hall" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-label="Hall of fame">
    <h2>hall of fame</h2>
    <p id="hall-note"></p>
    <div class="scroll"><table id="hall-table"></table></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
